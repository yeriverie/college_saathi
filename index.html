<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Saathi AI - PDACE</title>
    <style>
        body {
            background-color: #0e1117;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h1 { 
            font-size: 22px; 
            margin: 0 0 10px 0; 
            color: #60a5fa; 
        }
        p { 
            color: #94a3b8; 
            font-size: 13px; 
            margin: 0 0 25px 0; 
            line-height: 1.5;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: block;
            text-align: center;
            transition: background-color 0.2s;
        }
        .btn:hover { 
            background-color: #1d4ed8; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>College Saathi AI</h1>
        <p>PDA College of Engineering, Kalaburagi<br>Hackathon Prototype Portal</p>
        <a href="https://college-saathi-pdace.streamlit.app/" class="btn">Launch Live App</a>
    </div>
</body>
</html>
